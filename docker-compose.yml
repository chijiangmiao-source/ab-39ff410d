# Compose 编排：
#   web    —— 纯前端静态服务，启动后宿主机可经 ${WEB_PORT:-8080} 访问健康页与审计页
#   verify —— 围绕一组可覆盖/不可覆盖网，依次跑算法测试、前端构建检查、HTTP 冒烟，
#             完成后以退出码报告结果（docker compose run --rm verify；up 时也会执行并退出）
services:
  web:
    build: .
    image: km-coverability-audit:latest
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
    ports:
      # 宿主机端口可由 .env 或环境变量 WEB_PORT 配置，默认 8080
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  verify:
    build: .
    image: km-coverability-audit:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_PORT: "8080"
    command: ["sh", "scripts/verify-all.sh"]
    restart: "no"
